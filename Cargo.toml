[workspace]
members = [".", "crates/*"]
exclude = ["fuzz", "vendor"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[package]
name = "lightfast"
version = "0.1.0"
edition = "2024"
description = "Flatbed photo and art scanner for macOS, built on GPUI with pure-Rust scanner drivers."
publish = false

# macOS packaging: `scripts/macos/package.sh` (see docs/macos-release.md).
[package.metadata.bundle]
name = "Lightfast"
identifier = "io.simse.lightfast"
category = "public.app-category.photography"
copyright = "© 2026 Simon Sorensen"
short_description = "Flatbed photo and art scanner"
apple_signing_p12 = "signing/developer-id.p12"
apple_signing_password_env = "LIGHTFAST_P12_PASSWORD"
apple_signing_timestamp_url = "http://timestamp.apple.com/ts01"
apple_signing_hardened_runtime = true
apple_signing_entitlements = "scripts/macos/entitlements.plist"

[package.metadata.bundle.osx]
minimum_system_version = "27.0"
info_plist_exts = ["scripts/macos/Info.plist.ext"]
# Fetched by `scripts/macos/package.sh`, which also signs it.
frameworks = ["target/sparkle/Sparkle.framework"]

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
chrono = "0.4.45"
dirs = "7.0.0"
env_logger = { version = "0.11.11", features = ["kv"] }
fs4 = "1.1.0"
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-component = "0.8.1"
gpui_platform = { version = "=0.3.10", package = "gpui-pre-platform", features = ["font-kit"] }
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
log = { version = "0.4.34", features = ["kv"] }
mimalloc = "0.1.52"
num-traits = "0.2.19"
png = "0.18.1"
scan = { path = "crates/scan" }
tiff = "0.11.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSAppearance", "NSButton", "NSButtonCell", "NSCell", "NSControl", "NSGlassEffectView", "NSLayoutConstraint", "NSMenu", "NSMenuItem", "NSPopUpButton", "NSSegmentedControl", "NSSlider", "NSVisualEffectView", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor", "CGPath"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
raw-window-handle = "0.6.2"

# Release size: fat LTO + one codegen unit + stripped symbols take the
# executable from 26.4 MB to 15.7 MB; `opt-level = "z"` gets it to 9.6 MB.
# Fat LTO applies the root crate's opt-level to every crate (per-package
# overrides have no effect), so "z" makes PNG encoding ~6x slower: still
# ~125 MB/s, above USB scanner throughput, and encoding overlaps the scan.
# Non-RGB8 `to_rgb8` is ~12x slower; the RGB8 preview path is a memcpy.
# `"s"` (12.9 MB) is the fallback if the UI ever feels slow.
# `panic = "abort"` drops the unwind tables (~1.7 MB). Nothing recovers from
# panics: gpui's catch_unwind calls only clean up and re-raise.
[profile.release]
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
# The `cargo` group is opted into lint by lint: `multiple_crate_versions`
# only reports duplicates inside GPUI's dependency tree, which this crate
# can't influence.
cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
