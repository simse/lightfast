[package]
name = "scan-xerox-mfp"
version = "0.1.0"
edition = "2024"
description = "Samsung, Xerox and Dell MFP driver over USB and TCP, ported from SANE's xerox_mfp backend. Untested on real hardware."
license = "GPL-2.0-or-later WITH SANE-exception"
publish = false

[dependencies]
scan-core = { path = "../scan-core" }
scan-usb = { path = "../scan-usb", default-features = false }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[lints]
workspace = true
