name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Smaller artifacts make every sccache read and write faster, and keep more
  # of them under Upstash's 10 MB request limit.
  CARGO_PROFILE_DEV_DEBUG: '0'

# rustup installs the toolchain pinned in rust-toolchain.toml. Every check runs
# on Ubuntu ARM. Code behind cfg(target_os = "macos") is only compiled by the
# tagged macOS build in build.yml.
jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust
        run: rustup toolchain install

      - name: rustfmt
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GPUI's Linux platform links against these.
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev

      - name: install rust
        run: rustup toolchain install

      - name: sccache
        uses: ./.github/actions/sccache
        with:
          redis-url: ${{ secrets.REDIS_URL }}

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GPUI's Linux platform links against these.
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev

      - name: install rust
        run: rustup toolchain install

      - name: sccache
        uses: ./.github/actions/sccache
        with:
          redis-url: ${{ secrets.REDIS_URL }}

      - name: test
        run: cargo test --workspace --locked
